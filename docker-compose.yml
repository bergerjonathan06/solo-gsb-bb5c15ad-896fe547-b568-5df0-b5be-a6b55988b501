services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: pavilion-pipeline-isolation:latest
    container_name: pavilion-pipeline-isolation
    ports:
      # 宿主机端口:容器端口；如需改用其他宿主机端口，修改左侧即可
      - "8080:8080"
    environment:
      # 容器内监听端口（与右侧映射端口保持一致即可，一般无需修改）
      - PORT=8080
      - HOST=0.0.0.0
    restart: unless-stopped
